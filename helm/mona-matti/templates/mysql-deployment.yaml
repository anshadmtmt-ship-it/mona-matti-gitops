{{- if .Values.mysql.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mona-matti.fullname" . }}-mysql
  labels:
    {{- include "mona-matti.labels" . | nindent 4 }}
    app: {{ include "mona-matti.name" . }}-mysql
spec:
  replicas: {{ .Values.mysql.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "mona-matti.name" . }}-mysql
  template:
    metadata:
      labels:
        app: {{ include "mona-matti.name" . }}-mysql
    spec:
      containers:
        - name: mysql
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          ports:
            - containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mona-matti.fullname" . }}-secret
                  key: mysqlRootPassword
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "mona-matti.fullname" . }}-secret
                  key: databaseName
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "mona-matti.fullname" . }}-secret
                  key: databaseUsername
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mona-matti.fullname" . }}-secret
                  key: databasePassword
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: {{ include "mona-matti.fullname" . }}-mysql-pvc
{{- end }}
