apiVersion: v1
kind: Service
metadata:
  name: {{ include "mona-matti.fullname" . }}-stable
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: {{ include "mona-matti.name" . }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mona-matti.fullname" . }}-canary
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: {{ include "mona-matti.name" . }}
